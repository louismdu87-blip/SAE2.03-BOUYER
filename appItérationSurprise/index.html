<!doctype html>
<html lang="fr">
  <head>
    <title>SAE2.03 APP</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/base.css" />
  </head>

  <body>
    <header id="header"></header>

    <section id="movie-list-container"></section>

    <script type="module">
      import { DataMovie } from "./data/dataMovie.js";
      import { DataProfile } from "./data/dataProfile.js";

      import { NavBar } from "./component/NavBar/script.js";
      import { Movie } from "./component/Movies/script.js";
      import { MovieDetail } from "./component/MovieDetail/script.js";
      import { MovieCategory } from "./component/MovieCategory/script.js";
      


      //variables globales
      let data = await DataMovie.requestMovies();
      let profiles = await DataProfile.requestProfiles();
      let movies = null;
      let currentProfileId = null;

      // Controleur
      // Rappel, écrire window.C plutôt que let C est nécessaire pour tester depuis la console du navigateur
      // Une fois l'application terminée, on pourrait remettre let C.
      window.C = {};


      C.handlerFilms = function () {
        if (!currentProfileId) {
          alert("Veuillez d'abord sélectionner un profil en haut à droite !");
          return;
        }

        V.renderMoviesCategory(movies, "C.handlerMovieDetail");
      };

      C.handlerMovieDetail = async function (id) {
        let selectedMovie = await DataMovie.requestMovieDetails(id);
        let isFav = false;
        if (currentProfileId) {
            let favorites = await DataMovie.readFavorites(currentProfileId);
            if (favorites.length > 0 && favorites[0].id) {
                let found = favorites.find(m => m.id == id);
                if (found) {
                    isFav = true;
                }
            }
        }

        if (selectedMovie) {
          V.renderMovieDetail(selectedMovie, isFav);
        }
      };


      C.handlerSelectProfile = async function () {
        currentProfileId = document.querySelector(".navbar__select").value;
        let content = document.querySelector("#movie-list-container");

        if (!currentProfileId) {
          content.innerHTML =
            "<h2 style='text-align:center; margin-top:3rem; background-color: red;'>Veuillez sélectionner un profil en haut.</h2>";
          return;
        }

        let profileSelected = profiles.find((p) => p.id == currentProfileId);
        movies = await DataMovie.requestMovies(profileSelected.min_age);
        V.renderMoviesCategory(movies, "C.handlerMovieDetail");
      };

      C.handlerLogOut = function () {
        document.querySelector(".navbar__select").value = "";
        currentProfileId = null;
        C.handlerSelectProfile();
      };

     C.handlerFavorites = async function () {
        if (!currentProfileId) {
          alert("Veuillez sélectionner un profil pour voir vos favoris.");
          return;
        }
        let movies = await DataMovie.readFavorites(currentProfileId);
        if (movies.length == 0) {
          document.querySelector("#movie-list-container").innerHTML =
            "<p>Votre liste de favoris est vide.</p>";
          return;
        }
        V.renderMovies(movies);
      };

      C.handlerAddFavorite = async function (id_movie) {
        if (!currentProfileId) {
          alert("Veuillez sélectionner un profil avant d'ajouter un favori.");
          return;
        }
        let result = await DataMovie.addFavorite(currentProfileId, id_movie);
        alert(result);
        
        C.handlerMovieDetail(id_movie);
      };

      C.handlerDeleteFavorite = async function (id_movie) {
        let result = await DataMovie.deleteFavorite(currentProfileId, id_movie);
        alert(result);
        C.handlerMovieDetail(id_movie);
      };

      C.start = function () {
        V.renderNavBar(
          "C.handlerFilms()",
          "C.handlerFavorites()",
          "C.handlerSelectProfile()",
          profiles,
          "C.handlerLogOut()",
        );
        C.handlerSelectProfile();
      };

      // Vue (contient tout ce qui est relatif à l'affichage)
      window.V = {};

      /**
       * V.renderNavBar
       *
       * Cette fonction est responsable de l'affichage de la barre de navigation (NavBar).
       * Elle sélectionne l'élément HTML avec l'ID "header" et y insère le contenu
       * formaté par le composant NavBar.
       */
      V.renderNavBar = function (
        hFilms,
        hFavorites,
        handlerSelect,
        data,
        handlerLogOut,
      ) {
        let header = document.querySelector("#header");
        header.innerHTML = NavBar.format(
          hFilms,
          hFavorites,
          handlerSelect,
          data,
          handlerLogOut,
        );
      };

      V.renderMovies = function (movies) {
        let content = document.querySelector("#movie-list-container");
        content.innerHTML = Movie.format(movies);
      };

      V.renderMoviesCategory = function (groupedMovies) {
        let content = document.querySelector("#movie-list-container");
        let finalHtml = "";
        for (let categoryName in groupedMovies) {
          let moviesList = groupedMovies[categoryName];
          let moviesHtml = Movie.format(moviesList);
          finalHtml += MovieCategory.format(categoryName, moviesHtml);
        }

        content.innerHTML = finalHtml;
      };

       V.renderMovieDetail = function (data, isFavorite) { 
        let content = document.querySelector("#movie-list-container");
        content.innerHTML = MovieDetail.format(data, isFavorite); 
      };



    
      C.start();
    </script>
  </body>
</html>
